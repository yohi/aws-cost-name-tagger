name: G2 Offline Evidence Safety

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    name: G2 evidence integrity and fail-closed ZIP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan offline modules using the shared static guard
        run: python g2_static_guard.py g2_evidence.py g2_collector_contract.py g2_d2_saes.py g2_d2_rcp.py

      - name: G2 offline evidence tests (standard-library only)
        run: |
          python -m unittest -v test_g2_evidence test_g2_collector_contract test_g2_static_guard test_g2_d2_saes test_g2_d2_rcp

      - name: Run G2 tests with networking disabled (Docker)
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --volume "${{ github.workspace }}:/workspace:ro" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env AWS_EC2_METADATA_DISABLED=true \
            python:3.12-slim-bookworm \
            python -m unittest -q test_g2_evidence test_g2_collector_contract test_g2_static_guard test_g2_d2_saes test_g2_d2_rcp

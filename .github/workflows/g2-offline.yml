name: G2 Offline Evidence Safety

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    name: G2 evidence integrity and fail-closed ZIP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Forbid AWS SDK imports in offline evidence module
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("g2_evidence.py").read_text(encoding="utf-8"))
          forbidden = ("boto3", "botocore", "awscrt")
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  assert not any(alias.name.startswith(forbidden) for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module is not None:
                  assert not node.module.startswith(forbidden), node.module
          print("No AWS SDK imports in G2 offline module")
          PY

      - name: G2 offline evidence tests (standard-library only)
        run: |
          python -m unittest -v test_g2_evidence

name: Safety Hold CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Locked offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv (fixed tool version)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"

      - name: Verify fixed uv tool version
        run: |
          uv --version
          test "$(uv --version | awk '{print $2}')" = "0.13.5"

      - name: Install pinned dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Verify pinned boto3 and CRT
        run: |
          uv run --locked python -c 'import boto3, awscrt; assert boto3.__version__ == "1.43.116", boto3.__version__; print("boto3:", boto3.__version__)'

      - name: Validate SHA-256 manifest
        run: |
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("SHA256_MANIFEST.json").read_text(encoding="utf-8"))
          files = manifest["files"]
          assert len({entry["path"] for entry in files}) == len(files), "duplicate manifest path"
          for entry in files:
              path = Path(entry["path"])
              assert path.is_file(), f"missing: {path}"
              content = path.read_bytes()
              assert hashlib.sha256(content).hexdigest() == entry["sha256"], f"SHA-256 mismatch: {path}"
              assert len(content) == entry["bytes"], f"size mismatch: {path}"
          for required in ("uv.lock", ".github/workflows/ci.yml"):
              assert required in {entry["path"] for entry in files}, f"not listed: {required}"
          print(f"SHA256 manifest PASS ({len(files)} files)")
          PY

      - name: Unit tests (module runner)
        run: uv run --locked python -m unittest -q test_aws_cost_name_tagger_v3

      - name: Unit tests (direct script runner)
        run: uv run --locked python test_aws_cost_name_tagger_v3.py

      # Python standard-library trace provides executable-line instrumentation
      # without adding unpinned dependencies. It is not branch/MC/DC coverage.
      - name: Measure offline line coverage (Python 3.12)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -o pipefail
          STDLIB="$(uv run --locked --no-build python -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          SITE="$(uv run --locked --no-build python -c 'import site; print(site.getsitepackages()[0])')"
          uv run --locked --no-build python -m trace --count --missing --summary \
            --coverdir offline-line-coverage \
            --ignore-dir "$STDLIB" --ignore-dir "$SITE" \
            --module unittest -q test_aws_cost_name_tagger_v3 \
            2>&1 | tee trace-summary.txt

      - name: Record offline coverage provenance
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          coverage = sorted(Path("offline-line-coverage").rglob("*.cover"))
          assert coverage, "Expected annotated source coverage files"
          paths = [Path("trace-summary.txt"), *coverage]
          assert all(path.is_file() for path in paths)
          entries = [
              {
                  "path": path.as_posix(),
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in paths
          ]
          def git(*args):
              return subprocess.check_output(
                  ["git", *args], text=True
              ).strip()

          provenance = {
              "schema_version": 1,
              "purpose": "Offline Python executed-line coverage (not branch coverage)",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "github_ref": os.environ.get("GITHUB_REF", ""),
              "git_checkout_head": git("rev-parse", "HEAD"),
              "git_checkout_tree": git("rev-parse", "HEAD^{tree}"),
              "python_version": platform.python_version(),
              "uv_version": subprocess.check_output(
                  ["uv", "--version"], text=True
              ).strip(),
              "files": entries,
          }
          assert provenance["uv_version"].split()[1] == "0.13.5"
          output = Path("coverage-evidence.json")
          output.write_text(json.dumps(
              provenance, sort_keys=True, indent=2
          ) + "\n", encoding="utf-8")
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          print(f"COVERAGE_EVIDENCE_SHA256={digest}")
          print(f"COVERAGE_EVIDENCE_TREE={provenance['git_checkout_tree']}")
          print(f"COVERAGE_EVIDENCE_FILES={len(entries)}")
          PY

      - name: Upload offline line-coverage evidence
        if: matrix.python-version == '3.12'
        id: coverage-upload
        uses: actions/upload-artifact@v4
        with:
          name: offline-line-coverage-python-3-12
          path: |
            offline-line-coverage/
            trace-summary.txt
            coverage-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Record coverage artifact receipt
        if: matrix.python-version == '3.12'
        env:
          ARTIFACT_ID: ${{ steps.coverage-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coverage-upload.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          echo "COVERAGE_ARTIFACT_ID=$ARTIFACT_ID"
          echo "COVERAGE_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
